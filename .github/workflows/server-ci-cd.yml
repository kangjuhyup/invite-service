name: CI-CD

on:
  push:
    branches:
      - server

env:
  DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
  DOPPLER_PROJECT: ${{ vars.DOPPLER_PROJECT }}
jobs:
  build:
    runs-on: ubuntu-latest
    environment: CI/CD
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout
        uses: actions/checkout@v3

      - name: setup docker
        uses: docker/setup-buildx-action@v2

      - name: login contianer registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Doppler CLI
        run: |
          (curl -Ls --tlsv1.2 --proto "=https" --retry 3 https://cli.doppler.com/install.sh || wget -t 3 -qO- https://cli.doppler.com/install.sh) | sudo sh

      - name: Setup Doppler and download secrets
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          doppler setup --token $DOPPLER_TOKEN --project ${{ vars.DOPPLER_PROJECT }} --config prod --no-interactive
          doppler secrets download --no-file --format env > .env

      - name: docker build & push
        run: |
          docker buildx build \
            -f packages/server/Dockerfile \
            --platform linux/amd64,linux/arm64 \
            -t ghcr.io/${{ github.repository }}/service:latest \
            --push .

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: install ssh
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: deploy
        env:
          ORACLE_IP: ${{ secrets.ORACLE_INSTANCE_IP }}
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key
          chmod 600 private_key

          ssh -o StrictHostKeyChecking=no -i private_key ubuntu@$ORACLE_IP << 'EOF'
            docker login ghcr.io -u $GITHUB_ACTOR -p $GITHUB_TOKEN
            docker pull ghcr.io/${{ github.repository }}/service:latest
            docker stop invite-api || true
            docker rm invite-api || true
            docker run -d \
            -p 3003:3003 \
            --name invite-api \
            --mount type=bind,source=/home/ubuntu/projects/logs,target=/usr/src/app/logs \
            $(doppler secrets download --no-file --format docker) \
            ghcr.io/${{ github.repository }}/service:latest
          EOF
